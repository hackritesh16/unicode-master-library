name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite (needed by sqflite_common_ffi tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name unicode_master_library .
            # flutter create writes a counter-app test that references a class we do not have.
            rm -f test/widget_test.dart
          fi
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
