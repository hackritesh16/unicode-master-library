name: Build APK

# Manual only: this workflow never runs on push or pull request.
# Run it from the Actions tab ("Build APK" -> "Run workflow").
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name unicode_master_library .
            rm -f test/widget_test.dart
          fi

      - name: Configure Android manifest (INTERNET permission and app name)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi
          sed -i 's#android:label="[^"]*"#android:label="Unicode Master Library"#' "$MANIFEST"
          cat "$MANIFEST"

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: unicode-master-library-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
