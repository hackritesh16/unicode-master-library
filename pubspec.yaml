  shared_preferences: ^2.2.3
  share_plus: ^9.0.0
  http: ^1.2.1
  unorm_dart: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
